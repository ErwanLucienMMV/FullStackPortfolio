root /usr/share/nginx/html;
server_tokens off;
absolute_redirect off;
client_max_body_size 32k;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
location = /api { return 308 /api/$is_args$args; }
# The trailing slash strips /api/ and retains query parameters.
location /api/ {
    proxy_pass http://portfolio_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
}
location /data/ { expires -1; try_files $uri =404; }
location = /index.html { expires -1; }
location ~* \.(?:js|css)$ { expires 1y; try_files $uri =404; }
location ~ /\. { deny all; }
location / { try_files $uri $uri/ /index.html; }
